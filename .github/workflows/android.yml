name: APK do Dia a Dia do ATM (Achados corrigidos)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar e publicar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar código-fonte do aplicativo
        run: unzip -qo Dia_a_Dia_do_ATM_Android_Fonte.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar WhatsApp direto e correção de Achados
        run: |
          if grep -q 'Intent.createChooser(' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java; then
            echo 'ERRO: não utilizar menu Compartilhar.'
            exit 1
          fi
          grep -q 'setPackage(packageName)' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'whatsapp://send?text=' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'Achado por:' app/src/main/assets/atm-find-patch.js
          grep -q 'Empresa:' app/src/main/assets/atm-find-patch.js

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Dia_a_Dia_do_ATM_Achados_Corrigidos
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Criar lançamento para download direto
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.2.0-rc1
          target_commitish: main
          name: Dia a Dia do ATM — Achados e Perdidos corrigidos
          prerelease: true
          body: |
            **Versão de teste Android.**

            - Corrigido o formulário de Achados e Perdidos: Quem encontrou e Empresa.
            - Comunicado com o formato Item, Data, Hora, Local, Achado por, Empresa.
            - WhatsApp abre diretamente no aplicativo instalado.
            - As demais abas continuam sem mudanças.
            - Novo ID Android para instalar ao lado da versão anterior, sem apagar seus dados.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
