name: APK do Dia a Dia do ATM (Reverter e Livro)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar e publicar APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar código-fonte do aplicativo
        run: unzip -qo Dia_a_Dia_do_ATM_Android_Fonte_v1.5.0.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar WhatsApp, movimentações e novos fluxos
        run: |
          if grep -q 'Intent.createChooser(' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java; then
            echo 'ERRO: menu Compartilhar não deve ser utilizado pelo botão WhatsApp.'
            exit 1
          fi
          grep -q 'setPackage(packageName)' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'whatsapp://send?text=' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'atm-movement-patch.js' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'CONVOCAÇÃO' app/src/main/assets/atm-movement-patch.js
          grep -q 'atm-new-found' app/src/main/assets/atm-movement-patch.js
          grep -q 'atm-workflow-patch.js' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'Reverter último registro' app/src/main/assets/atm-workflow-patch.js
          grep -q 'PROCEDIMENTO DE BAIXA' app/src/main/assets/atm-workflow-patch.js
          grep -q 'atm-roster-copy' app/src/main/assets/atm-workflow-patch.js
          grep -q 'undoByIndex' app/src/main/assets/atm-workflow-patch.js
          grep -q 'd.includeRonda = true' app/src/main/assets/atm-workflow-patch.js
          grep -q 'd.includeMovement = true' app/src/main/assets/atm-workflow-patch.js

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Dia_a_Dia_do_ATM_Reversao_v1_5
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Criar lançamento para download direto
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.5.0-rc1
          target_commitish: main
          name: Dia a Dia do ATM — Reversão em todas as abas e Livro corrigido
          prerelease: true
          body: |
            **Versão de teste Android.**

            - FA e Convocação geram FT automaticamente nas telas de Movimentações e Escalado.
            - Modelos diurno e noturno, com RE preenchido pelo cadastro.
            - Achados e Perdidos limpa o formulário ao compartilhar ou baixar o registro.
            - WhatsApp abre diretamente no app instalado, sem menu Compartilhar.
            - Aba Escalado limpa FA e FT após copiar/compartilhar, mantendo o texto fixo e com botão visível para reverter.
            - Procedimento de Baixa no modelo sem FT e sem RE; após copiar, limpa os dados com opção de reverter.
            - Livro sem KM 51. pré-definido, com ponto de milhar automático; após copiar ou compartilhar limpa KM e ocorrências, com opção de reverter.
            - Os campos Ronda da marcenaria e Movimentação da equipe voltam marcados no próximo Livro, mas podem ser desmarcados manualmente.
            - Escalado, Livro e Procedimento de Baixa guardam backups independentes para reverter mesmo ao mudar de aba.
            - Aba Colaboradores com botão para copiar a lista completa, organizada por escala e turno, com nome e RE, pronta para colar no WhatsApp ou texto.
            - O site e o layout permanecem no Netlify, sem mudanças.
            - ID Android diferente para instalar lado a lado com a versão anterior; não desinstale a versão antiga antes de testar.

            Teste no celular: abrir o aplicativo, escolher um comunicado e tocar no botão WhatsApp. Confirme a abertura do aplicativo e o texto preenchido.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
