name: APK do Dia a Dia do ATM (FA/FT e Convocação)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar e publicar APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar código-fonte do aplicativo
        run: unzip -qo Dia_a_Dia_do_ATM_Android_Fonte_v1.3.0.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar WhatsApp, Achados e movimentações
        run: |
          if grep -q 'Intent.createChooser(' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java; then
            echo 'ERRO: menu Compartilhar não deve ser utilizado pelo botão WhatsApp.'
            exit 1
          fi
          grep -q 'setPackage(packageName)' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'whatsapp://send?text=' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'atm-movement-patch.js' app/src/main/java/br/com/diaadiaatm/app/MainActivity.java
          grep -q 'CONVOCAÇÃO' app/src/main/assets/atm-movement-patch.js
          grep -q 'atm-new-found' app/src/main/assets/atm-movement-patch.js

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Dia_a_Dia_do_ATM_Movimentacoes_v1_3
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Criar lançamento para download direto
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.3.0-rc1
          target_commitish: main
          name: Dia a Dia do ATM — FA/FT, Convocação e novos Achados
          prerelease: true
          body: |
            **Versão de teste Android.**

            - FA e Convocação geram FT automaticamente nas telas de Movimentações e Escalado.
            - Modelos diurno e noturno, com RE preenchido pelo cadastro.
            - Achados e Perdidos limpa o formulário ao compartilhar ou baixar o registro.
            - WhatsApp abre diretamente no app instalado, sem menu Compartilhar.
            - O site e o layout permanecem no Netlify, sem mudanças.
            - ID Android diferente para instalar lado a lado com a versão anterior; não desinstale a versão antiga antes de testar.

            Teste no celular: abrir o aplicativo, escolher um comunicado e tocar no botão WhatsApp. Confirme a abertura do aplicativo e o texto preenchido.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
